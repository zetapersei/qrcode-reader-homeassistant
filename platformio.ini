[env:esp32cam]
platform = espressif32 @ 6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    alvarowolfx/ESP32QRCodeReader @ ^1.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DMQTT_MAX_PACKET_SIZE=512

board_build.partitions = huge_app.csv